<!DOCTYPE html><html lang="en"><head>
<meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Movie | Allend TV</title><link rel="stylesheet" href="style.css"><style>.movie-player{max-width:1100px;margin:20px auto;background:#191b21;border:1px solid #30323b;border-radius:12px;overflow:hidden}.screen{position:relative;aspect-ratio:16/9;background:#000}.screen video{display:block;width:100%;height:100%;background:#000}.watermark{position:absolute;top:14px;left:14px;width:230px;max-width:34%;opacity:.55;pointer-events:none}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#15161d}.controls button,.controls select{background:#252731;border:1px solid #41434f;border-radius:8px;padding:10px;color:#fff;cursor:pointer}.controls input{accent-color:#a78bfa}.controls #seek{flex:1;min-width:100px}.details{padding:18px}.status{color:#b8b5c3;font-size:13px;padding:12px}.screen:fullscreen{aspect-ratio:auto;width:100%;height:100%}.screen:fullscreen video{height:100%;object-fit:contain}@media(max-width:650px){.movie-player{margin:10px}.watermark{width:140px}.controls{gap:5px}.controls #volume{display:none}}
.video-controls{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.75);display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:10px 8px;transition:opacity .25s,visibility .25s}
.video-controls button{background:transparent;border:0;color:#fff;font-size:22px;padding:8px;min-height:40px}
.video-controls #seek{flex:1 1 130px;min-width:55px;accent-color:#a78bfa}
.video-controls #volume{width:65px;accent-color:#a78bfa}
.screen.controls-hidden .video-controls{opacity:0;visibility:hidden;pointer-events:none}
.screen.controls-hidden{cursor:none}
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:12px;background:#15161d;border-bottom:1px solid #30323b}
.toolbar button,.toolbar select{background:#252731;border:1px solid #41434f;border-radius:8px;color:#fff;padding:10px;cursor:pointer}
.toolbar label{color:#fff;font-size:14px}
.movie-queue{padding:14px 18px;background:#20212b;border-bottom:1px solid #41434f}
.movie-queue button{background:#252731;border:1px solid #41434f;color:#fff;padding:10px;border-radius:8px;cursor:pointer;margin:5px}
.movie-queue button.active{border-color:#a78bfa}
.next-countdown{position:absolute;bottom:90px;right:18px;z-index:25;background:#171321;border:1px solid #a78bfa;border-radius:10px;padding:15px}
.next-countdown[hidden],.skip-intro[hidden]{display:none!important}
.next-countdown button,.skip-intro{background:#292135;color:white;border:1px solid #a78bfa;border-radius:8px;padding:10px;cursor:pointer}
.skip-intro{position:absolute;right:18px;bottom:95px;z-index:24}
@media(max-width:650px){.video-controls{gap:2px;padding:7px 5px}.video-controls button{font-size:17px;padding:5px}.video-controls #volume{display:none}.toolbar{padding:8px}}
</style></head><body><header><div class="wrap"><a class="brand-motion" id="brandMotion" href="index.html" aria-label="Allend TV Home"><img class="brand" alt="Allend TV" src="https://i.postimg.cc/tTDp2BGm/Allend-Video.png"><span class="brand-gradient-glow" aria-hidden="true"></span></a></div></header><nav class="back-row">
    <button class="back-btn" type="button"
  aria-label="Go back"
  onclick="history.back()">
  &#8592;
</button></nav><div class="movie-player"><div class="screen" id="screen"><video id="video" playsinline webkit-playsinline preload="auto"></video><img class="watermark" alt="" src="https://i.postimg.cc/tTDp2BGm/Allend-Video.png"><button id="skipIntro" class="skip-intro" hidden>⏭ Skip Intro</button><div class="next-countdown" id="movieCountdown" hidden><strong id="movieCountdownText"></strong><button id="playNextNow">Play now</button><button id="cancelNext">Cancel</button></div><div class="video-controls" id="movieControls"><button id="play" aria-label="Play or pause">▶</button><span id="time">0:00 / 0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><button id="mute">🔊</button><input id="volume" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume"><button id="fullscreen">⛶</button></div></div><div class="toolbar"><button id="back10">↶ 10s</button><button id="forward10">10s ↷</button><label>Speed <select id="speed"><option value=".5">0.5×</option><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label><button id="pip">▣ Mini player</button><button id="cinema">☾ Theater</button><button id="loop">↻ Loop off</button><button id="shuffle">⤨ Shuffle on</button><button id="screenshot">▧ Snapshot</button><label><input id="autoNext" type="checkbox" checked> Auto-play next movie</label></div><div class="movie-queue"><strong>Up next · shuffled movie queue</strong><div id="queueList"></div><button id="shuffleQueue">Shuffle queue</button></div><div class="status" id="status">Select a movie from the library.</div><div class="details"><h2 id="title">Movie</h2><p class="muted" id="description"></p><button id="resume" hidden>▶ Resume watching</button></div></div><script src="tokens.js"></script><script src="movies.js"></script><script src="site.js"></script><script src="movie-player.js"></script><script src="jump-to-player.js"></script></body></html>
