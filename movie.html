<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Movie | Allend TV</title><link rel="stylesheet" href="style.css"><style>.movie-player{max-width:1100px;margin:20px auto;background:#191b21;border:1px solid #30323b;border-radius:12px;overflow:hidden}.screen{position:relative;aspect-ratio:16/9;background:#000}.screen video{display:block;width:100%;height:100%;background:#000}.watermark{position:absolute;top:14px;left:14px;width:230px;max-width:34%;opacity:.55;pointer-events:none}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#15161d}.controls button,.controls select{background:#252731;border:1px solid #41434f;border-radius:8px;padding:10px;color:#fff;cursor:pointer}.controls input{accent-color:#a78bfa}.controls #seek{flex:1;min-width:100px}.details{padding:18px}.status{color:#b8b5c3;font-size:13px;padding:12px}.screen:fullscreen{aspect-ratio:auto;width:100%;height:100%}.screen:fullscreen video{height:100%;object-fit:contain}@media(max-width:650px){.movie-player{margin:10px}.watermark{width:140px}.controls{gap:5px}.controls #volume{display:none}}</style></head><body><header><div class="wrap"><div class="brand-motion" id="brandMotion"><img class="brand" alt="Allend TV" src="https://i.postimg.cc/tTDp2BGm/Allend-Video.png"><span class="brand-gradient-glow" aria-hidden="true"></span></div></div></header><nav class="back-row"><a class="back-link" href="movies.html">❮ &nbsp; Back to Movies</a></nav><div class="movie-player"><div class="screen" id="screen"><video id="video" playsinline preload="metadata"></video><img class="watermark" alt="" src="https://i.postimg.cc/tTDp2BGm/Allend-Video.png"></div><div class="controls"><button id="play">▶ Play</button><span id="time">0:00 / 0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><button id="mute">🔊</button><input id="volume" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume"><button id="back10">↶ 10s</button><button id="forward10">10s ↷</button><label>Speed <select id="speed"><option value=".5">0.5×</option><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="pip">▣ Mini player</button><button id="fullscreen">⛶ Fullscreen</button></div><div class="status" id="status">Select a movie from the library.</div><div class="details"><h2 id="title">Movie</h2><p class="muted" id="description"></p><button id="resume" hidden>▶ Resume watching</button></div></div><script src="movies.js"></script><script src="site.js"></script><script src="movie-player.js"></script></body></html>
