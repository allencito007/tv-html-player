<!DOCTYPE html><html lang="en"><head>
<meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live TV | Allend TV</title><link rel="stylesheet" href="style.css"><style>.movie-player{max-width:1100px;margin:20px auto;background:#191b21;border:1px solid #30323b;border-radius:12px;overflow:hidden}.screen{position:relative;aspect-ratio:16/9;background:#000}.screen video{display:block;width:100%;height:100%;background:#000}.watermark{position:absolute;top:14px;left:14px;width:230px;max-width:34%;opacity:.55;pointer-events:none}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#15161d}.controls button,.controls select{background:#252731;border:1px solid #41434f;border-radius:8px;padding:10px;color:#fff;cursor:pointer}.controls input{accent-color:#a78bfa}.controls #seek{flex:1;min-width:100px}.details{padding:18px}.status{color:#b8b5c3;font-size:13px;padding:12px}.screen:fullscreen{aspect-ratio:auto;width:100%;height:100%}.screen:fullscreen video{height:100%;object-fit:contain}@media(max-width:650px){.movie-player{margin:10px}.watermark{width:140px}.controls{gap:5px}.controls #volume{display:none}}
.video-controls{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.75);display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:10px 8px;transition:opacity .25s,visibility .25s}
.video-controls button{background:transparent;border:0;color:#fff;font-size:22px;padding:8px;min-height:40px}
.video-controls #seek{flex:1 1 130px;min-width:55px;accent-color:#a78bfa}
.video-controls #volume{width:65px;accent-color:#a78bfa}
.screen.controls-hidden .video-controls{opacity:0;visibility:hidden;pointer-events:none}
.screen.controls-hidden{cursor:none}
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:12px;background:#15161d;border-bottom:1px solid #30323b}
.toolbar button,.toolbar select{background:#252731;border:1px solid #41434f;border-radius:8px;color:#fff;padding:10px;cursor:pointer}
.toolbar label{color:#fff;font-size:14px}
.movie-queue{padding:14px 18px;background:#20212b;border-bottom:1px solid #41434f}
.movie-queue button{background:#252731;border:1px solid #41434f;color:#fff;padding:10px;border-radius:8px;cursor:pointer;margin:5px}
.movie-queue button.active{border-color:#a78bfa}
.next-countdown{position:absolute;bottom:90px;right:18px;z-index:25;background:#171321;border:1px solid #a78bfa;border-radius:10px;padding:15px}
.next-countdown[hidden],.skip-intro[hidden]{display:none!important}
.next-countdown button,.skip-intro{background:#292135;color:white;border:1px solid #a78bfa;border-radius:8px;padding:10px;cursor:pointer}
.skip-intro{position:absolute;right:18px;bottom:95px;z-index:24}
@media(max-width:650px){.video-controls{gap:2px;padding:7px 5px}.video-controls button{font-size:17px;padding:5px}.video-controls #volume{display:none}.toolbar{padding:8px}}

.live-player{max-width:1100px;margin:20px auto;background:#191b21;border:1px solid #30323b;border-radius:12px;overflow:hidden}
.live-player[hidden]{display:none!important}.live-player .screen{position:relative;aspect-ratio:16/9;background:#000}.live-player .screen video{width:100%;height:100%;object-fit:contain}
.live-indicator{position:absolute;right:16px;top:16px;background:#9c1b35;color:white;padding:6px 12px;border-radius:6px;font-weight:bold;z-index:12;pointer-events:none}
.live-loading{position:absolute;left:50%;top:43%;width:40px;height:40px;margin:-20px;border:4px solid #777;border-top-color:#c4b5fd;border-radius:50%;animation:live-spin 1s linear infinite;z-index:15;pointer-events:none}.live-loading[hidden]{display:none!important}
@keyframes live-spin{to{transform:rotate(360deg)}}
.live-player .video-controls button:focus-visible,.live-player .toolbar button:focus-visible{outline:3px solid #c4b5fd}
.live-player .details{padding:16px 18px}.live-player .status{padding:12px 18px}
</style></head><body><header><div class="wrap"><a class="brand-motion" id="brandMotion" href="index.html" aria-label="Allend TV Home"><img class="brand" alt="Allend TV" src="https://i.postimg.cc/tTDp2BGm/Allend-Video.png"><span class="brand-gradient-glow" aria-hidden="true"></span></a></div></header><nav class="back-row">
    <button class="back-btn" type="button"
  aria-label="Go back"
  onclick="history.back()">
  &#8592;
</button>
</nav><main class="wrap"><p class="eyebrow"></p><h1>Live TV</h1><p class="intro"></p><div id="channelGrid" class="poster-grid">
<button type="button" class="channel-card" data-channel-id="pars-tv" aria-label="Watch Pars TV"><img src="https://www.persianity.com/thumb.php?src=https://www.persiran.com/index_files/channels/parstv.png" alt="Pars TV logo" onerror="this.style.display='none'" loading="lazy"><strong>Pars TV</strong><small>Watch live →</small></button>
</div><p class="notice" id="emptyChannels" hidden>No channels added yet.</p><section id="livePlayer" class="live-player" hidden>
  <div class="screen" id="liveScreen">
    <video id="liveVideo" playsinline webkit-playsinline preload="auto"></video>
    <img class="watermark" alt="Allend TV" src="https://i.postimg.cc/tTDp2BGm/Allend-Video.png">
    <span class="live-indicator" id="liveIndicator">● LIVE</span>
    <div class="live-loading" id="liveLoading" hidden></div>
    <div class="video-controls" id="liveControls">
      <button id="livePlay" type="button" aria-label="Play or pause">▶</button>
      <span id="liveTime">LIVE</span>
      <button id="liveMute" type="button" aria-label="Mute or unmute">🔊</button>
      <input id="liveVolume" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume">
      <button id="liveFullscreen" type="button" aria-label="Fullscreen">⛶</button>
    </div>
  </div>
  <div class="toolbar">
    <button id="liveGoLive" type="button">● Go Live</button>
    <label>Speed <select id="liveSpeed"><option value=".5">0.5×</option><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
    <button id="livePip" type="button">▣ Mini player</button>
    <button id="liveCinema" type="button">☾ Theater</button>
    <button id="liveSnapshot" type="button">▧ Snapshot</button>
  </div>
  <p class="status" id="liveStatus" role="status">Choose a channel.</p>
  <div class="details"><h2 id="channelTitle">Live TV</h2></div>
</section><p class="footer"></p></main><script src="tokens.js"></script><script src="site.js"></script><script src="channels.js"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script><script src="live-player.js"></script></body></html>
